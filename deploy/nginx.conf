# Nginx 反代示例（把 Node 3000 端口暴露到 80/443）
# 放到 /etc/nginx/sites-available/yuanchong，软链到 sites-enabled，然后 nginx -t && systemctl reload nginx
# 假设域名 yuanchong.example.com，Node 监听 127.0.0.1:3000

server {
    listen 80;
    server_name yuanchong.example.com;   # 改成你的域名或服务器 IP

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 有域名后用 certbot 申请 HTTPS：
#   sudo certbot --nginx -d yuanchong.example.com
