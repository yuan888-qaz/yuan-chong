<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 屿安代充</title>
<link rel="stylesheet" href="/client/style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <a class="logo" href="/client/index.html"><span class="mark">屿</span>屿安代充</a>
    <nav class="top-nav"><a href="/client/index.html">返回首页</a></nav>
  </div>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <h1>欢迎登录</h1>
    <p class="sub">登录屿安代充，安全秒充</p>
    <div class="msg" id="msg"></div>
    <div class="field">
      <label>账号</label>
      <input id="username" placeholder="请输入账号">
    </div>
    <div class="field">
      <label>密码</label>
      <input id="password" type="password" placeholder="请输入密码">
    </div>
    <button class="submit" onclick="doLogin()">登 录</button>
    <p class="auth-alt">还没有账号？<a href="/client/register.html">立即注册</a></p>
  </div>
</div>

<script src="/client/common.js"></script>
<script>
async function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  try{
    const data=await api('/login',{method:'POST',body:{username,password}});
    localStorage.setItem('yc_token',data.token);
    localStorage.setItem('yc_user',JSON.stringify(data.user));
    location.href='/client/index.html';
  }catch(e){
    msg.className='msg err';msg.textContent=e.message;
  }
}
</script>
</body>
</html>
