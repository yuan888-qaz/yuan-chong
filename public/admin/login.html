<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员登录 · 屿安代充后台</title>
<link rel="stylesheet" href="/admin/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>屿安代充 · 管理后台</h1>
    <div class="msg" id="msg"></div>
    <div class="field"><label>管理员账号</label><input id="username" placeholder="admin"></div>
    <div class="field"><label>密码</label><input id="password" type="password" placeholder="密码"></div>
    <button class="btn" style="width:100%" onclick="doLogin()">登 录</button>
  </div>
</div>
<script src="/admin/common.js"></script>
<script>
async function doLogin(){
  const username=document.getElementById('username').value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('msg');
  try{
    const data=await api('/login',{method:'POST',body:{username,password}});
    if(data.user.role!=='admin') throw new Error('该账号不是管理员');
    localStorage.setItem('admin_token',data.token);
    location.href='/admin/index.html';
  }catch(e){msg.className='msg err';msg.textContent=e.message;}
}
</script>
</body>
</html>
